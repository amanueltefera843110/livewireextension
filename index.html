<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Voice Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .message {
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }
        .ai {
            background: #f1f3f4;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        .controls-area {
            background: white;
            padding: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        #status { margin-bottom: 10px; font-weight: 600; color: #666; height: 20px; }
        #livePreview { height: 20px; color: #999; font-style: italic; margin-bottom: 15px; }

        .btn {
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        #startBtn { background: #28a745; color: white; }
        #stopBtn { background: #dc3545; color: white; display: none; }

        .pulse { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="chat-container">
        <div id="chatBox">
            <div class="message ai">I am ready. Click Start and I will stay listening until you click Stop.</div>
        </div>
        
        <div class="controls-area">
            <div id="status">Ready</div>
            <div id="livePreview"></div>
            
            <button id="startBtn" class="btn">▶ Start Conversation</button>
            <button id="stopBtn" class="btn">⏹ Stop</button>
        </div>
    </div>

<script>
    const BACKEND_URL = 'http://127.0.0.1:5000/chat';

    const chatBox = document.getElementById('chatBox');
    const statusDiv = document.getElementById('status');
    const livePreview = document.getElementById('livePreview');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let recognition;
    let isConversationActive = false;
    let conversationHistory = [];

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        
        // CRITICAL CHANGE: Keep the microphone open
        recognition.continuous = true; 
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            statusDiv.textContent = "🔴 Listening... (Go ahead and speak)";
            statusDiv.style.color = "#d32f2f";
            startBtn.classList.add('pulse');
        };

        recognition.onend = () => {
            // If the browser stops the mic (timeout) but we want it open, restart it
            if (isConversationActive) {
                console.log("Restarting recognition...");
                recognition.start();
            } else {
                statusDiv.textContent = "Conversation Stopped";
                startBtn.classList.remove('pulse');
                startBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
            }
        };

        recognition.onresult = (event) => {
            let currentTranscript = '';
            
            // Loop specifically to find the NEWEST final sentence
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    const sentence = event.results[i][0].transcript;
                    processUserSpeech(sentence);
                } else {
                    currentTranscript += event.results[i][0].transcript;
                }
            }
            
            livePreview.textContent = currentTranscript;
        };

        recognition.onerror = (event) => {
            console.error("Speech Error:", event.error);
            if (event.error !== 'no-speech') {
                statusDiv.textContent = "Error: " + event.error;
            }
        };
    }

    function startConversation() {
        isConversationActive = true;
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        recognition.start();
    }

    function stopConversation() {
        isConversationActive = false;
        recognition.stop();
        statusDiv.textContent = "Stopping...";
    }

    async function processUserSpeech(text) {
        if (!text.trim()) return;

        // Add to Chat UI
        addMessage(text, 'user');
        
        // Note: We do NOT stop the mic. It stays open.
        statusDiv.textContent = "🤖 ChatGPT is thinking... (Mic still on)";
        
        conversationHistory.push({ role: "user", content: text });

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: conversationHistory })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error);

            addMessage(data.reply, 'ai');
            conversationHistory.push({ role: "assistant", content: data.reply });
            statusDiv.textContent = "🔴 Listening...";

        } catch (error) {
            addMessage("Error: " + error.message, 'ai');
        }
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    startBtn.onclick = startConversation;
    stopBtn.onclick = stopConversation;

</script>
</body>
</html>
